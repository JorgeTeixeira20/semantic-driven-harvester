[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-driven-harvester"
version = "0.1.0"
description = "Cliente simples para obter metadados e texto do Arquivo.pt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.6,<8",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Consultas SPARQL ao grafo completo de um corpus da Fase 1 (sparql_corpus.py).
sparql = ["pyoxigraph>=0.5,<0.6"]

[project.scripts]
harvester-smoke-test = "semantic_harvester.smoke_test:main"
harvester-rdf-sample = "semantic_harvester.rdf_mapper:main"
harvester-article-history = "semantic_harvester.history_pipeline:main"
harvester-api-profiling = "semantic_harvester.api_profiling:main"
harvester-api-diagnostics = "semantic_harvester.api_diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]
